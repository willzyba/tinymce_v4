<!DOCTYPE html>
<!--
  A complete, working example of TinyMCE 4 with the CodeCogs Equation Editor plugin already
  built into this vendored copy (plugins/eqneditor). No npm install needed - everything here
  is a static file - just open this in a browser (or serve it, since some browsers block
  local-file <script> loading of sibling files; `python3 -m http.server` from this directory
  works fine).
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodeCogs Equation Editor - TinyMCE 4 example</title>

    <script src="./tinymce.min.js"></script>

    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
               max-width: 900px; margin: 0 auto; padding: 24px; color: #1c2530; }
        p.hint { color: #52606d; font-size: 14px; }
    </style>

    <script>
        tinymce.init({
            selector: '#mytextarea',
            plugins: 'eqneditor',
            toolbar: 'undo redo | bold italic | eqneditor',
            height: 420,

            // Points this dev example at the local eqneditor-v5-www dev server rather than
            // production, so in-progress features (the new toolbar, MathView-by-default) show
            // up here before they are live at editor.codecogs.com. Remove both for production.
            eqneditor_script_url: 'http://localhost:8010/eqneditor.api.min.js',
            eqneditor_css_url: 'http://localhost:8010/eqneditor.css'
        });
    </script>
</head>
<body>
    <h1>CodeCogs Equation Editor in TinyMCE 4</h1>
    <p class="hint">
        Press the <strong>fx</strong> button on the toolbar to insert an equation, or
        double-click the equation below to edit it.
    </p>

    <form method="post">
      <textarea id="mytextarea">
        <p>Sample text and an equation:</p>
        <p><img src="https://latex.codecogs.com/svg.image?\sum_{i=0}^{n}a_i^2&plus;b"
                alt="\sum_{i=0}^{n}a_i^2+b"></p>
        <p>Double-click the equation above to edit it.</p>
      </textarea>
    </form>
</body>
</html>
